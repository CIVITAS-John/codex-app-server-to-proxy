name: Offline CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  offline:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      CODEX_TEST_COVERAGE: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Formatting, linting, and protocol regeneration are platform-independent,
      # so they run once on Linux; every platform still runs the full test suite.
      - name: Check formatting, lint, and protocol drift
        if: matrix.os == 'ubuntu-latest'
        run: npm run check
      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: npm test
      - name: Test the packed npm CLI
        run: npm run test:package
      - name: Publish maintained-source coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: offline-coverage-node-24
          path: coverage/
          if-no-files-found: error
          retention-days: 14
